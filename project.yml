name: DeepSeekAIBrowser
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # 合法值是 4.0 / 4.2 / 5.0 / 6.0。写 5.9 会让 xcodebuild 直接报
    # "SWIFT_VERSION '5.9' is unsupported"，CI 必红。
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  DeepSeekAIBrowser:
    type: application
    platform: iOS
    sources:
      - path: DeepSeekAIBrowser
        excludes:
          - "Info.plist"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AI浏览器
        CFBundleShortVersionString: "0.6.1"
        CFBundleVersion: "12"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.aibrowser
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    # 显式声明 scheme：不声明时 XcodeGen 不一定往 xcshareddata 写 .xcscheme，
    # CI 上 `xcodebuild -scheme DeepSeekAIBrowser` 会报 "does not contain a scheme named ..."。
    scheme:
      build:
        targets:
          DeepSeekAIBrowser: all
      run:
        config: Debug
      profile:
        config: Release
      analyze:
        config: Debug
      archive:
        config: Release